<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
    margin : 0;
    padding : 0;
    box-sizing : border-box;
    }
    
    html, body {
    height : 100%;
    width: 100%;
    }

    body{
      position: relative;
      overflow: hidden;
    }

    #main{
      width: 100%;
      height: 100%;
      background-color: #222;
    }

    #nav{
      
      width: 100%;
      height: 100%;
      background-color: #444;
    }

    a{
      color: white;
    }

    button{
      padding: 12px 22px;
      background-color: red;
      border-radius: 5px;
      border: none;
      font-weight: 600;
      font-size: 20px;
    }

  </style>
</head>
<body>
  
  <div id="main">
    <div id="nav">
      <a href="">home</a>
      <a href="">about</a>
      <button>Click and follow</button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
