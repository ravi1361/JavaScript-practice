
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Mood Picker</title>
</head>
<body>

  <h1>How Are You Feeling Today? 😊</h1>

  <button class="mood" data-mood="Happy">😊</button>
  <button class="mood" data-mood="Sad">😢</button>
  <button class="mood" data-mood="Excited">🤩</button>
  <button class="mood" data-mood="Angry">😡</button>
  <button class="mood" data-mood="Sleepy">😴</button>

  <h2 id="result">Select your mood!</h2>

  <script src="script.js"></script>
</body>
</html>
