
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    #palette {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 25px 0;
    }

    .color-card {
      width: 120px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .color-box {
      height: 100px;
    }

    .color-code {
      padding: 10px 4px;
      font-size: 14px;
    }

    button {
      padding: 10px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Color Palette Generator 🎨</h1>

  <button id="generate">Generate Colors</button>

  <div id="palette"></div>

  <script src="script.js"></script>
</body>
</html>
