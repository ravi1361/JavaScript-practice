
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Quick Learning</h1>
        <p>Click the card to reveal the answer!</p>

        <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Reveal answer">
            <span id="cardLabel">QUESTION</span>
            <h2 id="cardText">What does CSS stand for?</h2>
        </div>

        <button id="nextBtn">Next Card →</button>
        <p id="progress">Card 1 of 5</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
