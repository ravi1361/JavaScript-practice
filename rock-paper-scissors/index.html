
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
</head>
<body>

  <h1>Rock Paper Scissors 🎮</h1>
  <p>Choose your move!</p>

  <button class="choice" data-choice="rock">🪨 Rock</button>
  <button class="choice" data-choice="paper">📄 Paper</button>
  <button class="choice" data-choice="scissors">✂️ Scissors</button>

  <h2 id="result">Result will appear here</h2>
  <p id="moves"></p>

  <p>Your Score: <span id="userScore">0</span></p>
  <p>Computer Score: <span id="computerScore">0</span></p>

  <button id="reset">Reset Game</button>

  <script src="script.js"></script>
</body>
</html>
